<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FLIK - Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="auth-layout">

    <div class="page-loader" id="page-loader" role="status" aria-label="Loading login">
        <div class="loader-content">
            <div class="loader-block loader-panel" style="max-width: 450px; height: 360px; margin: 15vh auto 0;"></div>
        </div>
    </div>
    
    <!-- NEW: System Pre-Flight Modal -->
    <div id="digicamModal" class="modal-overlay">
        <div class="confirm-box" style="text-align: center; border: 1px solid #3b82f6; box-shadow: 0 10px 40px rgba(59, 130, 246, 0.2);">
            <h3 style="color: #3b82f6; font-size: 22px; margin-bottom: 15px;">Before Starting</h3>
            <p style="color: #ddd; margin-bottom: 25px; line-height: 1.5; font-size: 15px;">
                Please ensure the <strong>DigiCamControl App</strong> is running and your DSLR camera is powered on and connected before proceeding.
            </p>
            <div class="confirm-actions">
                <button class="btn-modal" style="background: #3b82f6; color: white; width: 100%; font-size: 15px; padding: 14px;" onclick="proceedToDashboard()">
                    Okay ➔
                </button>
            </div>
        </div>
    </div>

    <div class="auth-panel">
        <div class="brand-header">
            <h1 class="brand-text-login"><img src="../../assets/Logo.png" alt="FLIK Logo"></h1>
            <p class="sys-version">Log in</p>
        </div>
        
        <!-- Changed to trigger the modal via onsubmit -->
        <form id="login-form">
            <div class="form-control">
                <label for="username">Username :</label>
                <input type="text" id="username" autocomplete="off" required>
            </div>
            <div class="form-control">
                <label for="password">Password :</label>
                <input type="password" id="password" required>
            </div>
                            <p id="error-message" style="color: #ff4d4d; font-weight: bold; display: none; text-align: center; margin-top: 10px;">
                     Access Denied: Incorrect username or password.
                </p>
            <button type="submit" class="btn-primary">Log In</button>
        </form>
        
        <div class="auth-footer">
            <p>Est. 2026</p>
        </div>
    </div>

    <script>
        // 1. Intercept the login form submission
        function showPreflightModal(event) {
            event.preventDefault(); // Stop the form from redirecting immediately
            document.getElementById('digicamModal').style.display = 'flex';
        }

        // 2. Redirect to dashboard only after confirmation
        function proceedToDashboard() {
// 1. Your existing code that shows the warning message goes here...
// (e.g., warningMessage.style.display = 'block';)

// 2. Add the delay before redirecting
        setTimeout(() => {
            window.location.href = 'dashboard.html'; // Or whatever your exact path is
        }, 2500); // 2500 milliseconds = 2.5 seconds of reading time
        }
    </script>
    
    <script src="../js/login.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/loader.js"></script>
</body>
</html>
