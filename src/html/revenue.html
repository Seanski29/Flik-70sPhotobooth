<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLIK | The Vault</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="http://localhost:3001/socket.io/socket.io.js"></script>
</head>
<body class="app-layout">

    <div class="page-loader" id="page-loader" role="status" aria-label="Loading revenue">
        <div class="loader-sidebar">
            <div class="loader-block loader-logo"></div>
            <div class="loader-line loader-nav"></div>
            <div class="loader-line loader-nav"></div>
            <div class="loader-line loader-nav"></div>
            <div class="loader-line loader-nav"></div>
        </div>
        <div class="loader-content">
            <div class="loader-line loader-title"></div>
            <div class="loader-line loader-subtitle"></div>
            <div style="display: flex; gap: 30px;">
                <div class="loader-block loader-panel" style="height: 190px;"></div>
                <div class="loader-block loader-panel" style="height: 190px;"></div>
            </div>
        </div>
    </div>

    <div id="sidebar-container"></div> 

    <main class="workspace">
        <header class="workspace-header">
            <div>
                <h2 class="page-title">REVENUE</h2>
                <p class="page-subtitle">Lifetime Financial Overview & Analytics</p>
            </div>
        </header>

        <div class="stats-container">
            <div class="stat-card">
                <h3>Total Lifetime Revenue</h3>
                <div class="stat-value" id="totalRevenue">0 <span class="stat-currency">PHP</span></div>
            </div>
            
            <div class="stat-card">
                <h3>Total Sessions Completed</h3>
                <div class="stat-value stat-sessions" id="totalSessions">0</div>
            </div>
        </div>
        
        <div style="text-align: right;">
            <button class="btn-danger" onclick="resetRevenue()">Reset Vault (Clear All Data)</button>
        </div>
    </main>

    <script src="../js/sidebar.js"></script>
    <script src="../js/loader.js"></script>
    <script>
        const socket = io('http://localhost:3001');

        socket.on('connect', () => {
            socket.emit('request_sync');
        });

        socket.on('audit_update', (data) => {
            document.getElementById('totalRevenue').innerHTML = `${data.revenue} <span class="stat-currency">PHP</span>`;
            document.getElementById('totalSessions').innerText = data.sessions;
        });
        
        function resetRevenue() {
            if(confirm("WARNING: This will permanently delete all revenue and session history. Are you sure?")) {
                socket.emit('reset_revenue');
            }
        }
    </script>
</body>
</html>
