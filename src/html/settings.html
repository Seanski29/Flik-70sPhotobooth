<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLIK | Settings</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* INLINE SETTINGS STYLES TO OVERRIDE CONFLICTS */
        .settings-container {
            max-width: 800px;
            padding: 20px;
            padding-bottom: 80px; 
            font-family: 'Inter', system-ui, sans-serif;
            color: #ffffff;
            overflow-y: auto;
            height: calc(100vh - 120px); 
        }

        .settings-container::-webkit-scrollbar { width: 8px; }
        .settings-container::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        .settings-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 4px; }
        .settings-container::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }

        .settings-card {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .settings-card h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 22px;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .settings-card .subtitle {
            color: #cccccc;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            max-width: 350px;
        }

        .input-group label { margin-bottom: 8px; font-size: 14px; color: #eeeeee; }
        .input-group input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #555;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            outline: none;
        }

        .btn-primary {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            background-color: #ef4444;
            color: #ffffff;
            cursor: pointer;
            margin-top: 10px;
            width: fit-content;
        }

        .btn-secondary {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            background-color: #555;
            color: #ffffff;
            cursor: pointer;
            font-weight: bold;
        }

        .legal-links { margin-top: 15px; display: flex; gap: 15px; }
        .btn-text {
            background: none; border: none; color: #4ade80; text-decoration: underline; cursor: pointer; padding: 0; font-size: 14px;
        }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #222; color: #ffffff; padding: 25px; border-radius: 8px; max-width: 500px; width: 90%; border: 1px solid #444;
        }
        .modal-scroll-area { max-height: 300px; overflow-y: auto; margin-bottom: 20px; color: #cccccc; }
        
        .error-text { color: #ef4444; font-size: 14px; margin-top: 10px; font-weight: bold; }
        .success-text { color: #4ade80; font-size: 14px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body class="app-layout">
    
    <div id="sidebar-container"></div>

    <main class="workspace">
        <header class="workspace-header">
            <div>
                <h2 class="page-title">SYSTEM SETTINGS</h2>
                <p class="page-subtitle">Configuration & Preferences</p>
            </div>
        </header>

        <div class="settings-container">
            <section class="settings-card">
                <h2>Security</h2>
                <p class="subtitle">Update the operator login credentials.</p>
                <form id="password-form">
                    <div class="input-group">
                        <label for="current-password">Current Password</label>
                        <input type="password" id="current-password" required>
                    </div>
                    <div class="input-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" required>
                    </div>
                    <button type="submit" class="btn-primary">Update Password</button>
                    <p id="password-error" class="error-text" style="display: none;">Incorrect current password.</p>
                    <p id="password-success" class="success-text" style="display: none;">Password updated successfully.</p>
                </form>
            </section>

            <section class="settings-card">
                <h2>About FLIK</h2>
                <div class="about-info">
                    <p><strong>Version:</strong> 1.0.0</p>
                    <p><strong>Developed For:</strong> Scratch Solutions Inc.</p>
                </div>
                <div class="legal-links">
                    <button id="btn-privacy" class="btn-text">Privacy Policy</button>
                    <button id="btn-eula" class="btn-text">End User License Agreement</button>
                </div>
            </section>
        </div>
    </main>

    <div id="legal-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 id="modal-title">Legal Document</h2>
            <div id="modal-text" class="modal-scroll-area"></div>
            <button id="close-modal" class="btn-secondary">Close</button>
        </div>
    </div>
    
    <script src="../js/sidebar.js"></script>
    <script src="../js/settings.js"></script>
</body>
</html>
