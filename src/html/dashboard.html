<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLIK | Master Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="http://localhost:3001/socket.io/socket.io.js"></script>
</head>
<body class="app-layout">

    <div id="sidebar-container"></div> 

    <div id="resultOverlay">
        <button class="close-overlay-btn" onclick="closeResultOverlay()">&times;</button>
        <h2 style="color: #4ade80; margin-bottom: 20px; font-family: 'Inter', sans-serif;">🎉 Session Complete!</h2>
        <img id="finalCollageImg" src="" alt="Final Strip">
    </div>

    <main class="workspace">
        <header class="workspace-header">
            <div>
                <h2 class="page-title">⚡ <img src="../../assets/Logo.png" alt="FLIK" style="height: 30px; vertical-align: middle;"> SYSTEM DASHBOARD</h2>
                <p class="page-subtitle">Event Command Center</p>
            </div>
            <button class="btn-op btn-filter" style="padding: 10px 20px; font-size: 14px;" onclick="clearTerminal()">🔄 CLEAR LOGS</button>
        </header>

        <div class="dashboard-container">
            
            <!-- CLEAN TERMINAL -->
            <div class="terminal-container">
                <div class="terminal" id="terminalBox">
                    <div class="log-entry">> Initializing System UI...</div>
                </div>
            </div>

            <div class="right-column">
                <div class="preview-card">
                    <img id="webcam-preview" class="filter-NORMAL" src="http://localhost:5513/liveview.jpg">
                </div>

                <div class="panel-box">
                    <h3>Live Status</h3>
                    <div class="metric"><span>Customer Balance:</span> <span class="metric-value" id="balanceDisplay">0 PHP</span></div>
                    <div class="metric"><span>Active Filter:</span> <span class="metric-value" id="filterDisplay">NORMAL</span></div>
                    <div class="metric"><span>System Status:</span> <span class="metric-value" id="sessionDisplay">IDLE</span></div>
                </div>

                <div class="panel-box operator-panel">
                    <h3>Manual Filter Override</h3>
                    <div class="filter-grid">
                        <button class="btn-op btn-filter" onclick="setManualFilter('NORMAL')">🎨 Normal</button>
                        <button class="btn-op btn-filter" onclick="setManualFilter('NOIR')">⚫ Noir</button>
                        <button class="btn-op btn-filter" onclick="setManualFilter('FILM_II')">🎞️ Film II</button>
                    </div>

                    <h3 style="margin-top: 5px;">Session Overrides</h3>
                    <button id="btnForceStart" class="btn-op btn-force">📸 Force Start (Free Play)</button>
                    <button class="btn-op btn-reset" onclick="resetBalance()">💸 Reset Customer Balance</button>
                    <button id="btnAbort" class="btn-op btn-abort">🛑 Abort Session</button>
                    
                    <h3 style="margin-top: 5px;">System Controls</h3>
                    <button id="btnRestart" class="btn-op btn-restart" onclick="triggerSystemRestart()">🔄 Restart System Backend</button>
                    <button id="btnTestAudio" class="btn-op btn-audio" onclick="toggleTestAudio()">🔊 Test Audio (Play)</button>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/sidebar.js"></script>
    <script>
        const socket = io('http://localhost:3001');
        const terminalBox = document.getElementById('terminalBox');
        const liveView = document.getElementById('webcam-preview');
        
        const countdownAudio = new Audio('../../assets/10_sec_countdown.mp3');
        let overlayTimeout; 
        let audioUnlocked = false;

        document.body.addEventListener('click', () => {
            if (!audioUnlocked) {
                countdownAudio.play().then(() => {
                    countdownAudio.pause();
                    countdownAudio.currentTime = 0;
                    audioUnlocked = true;
                }).catch(err => {});
            }
        }, { once: true });

        countdownAudio.onended = () => {
            document.getElementById('btnTestAudio').innerHTML = "🔊 Test Audio (Play)";
        };

        function toggleTestAudio() {
            const btn = document.getElementById('btnTestAudio');
            if (countdownAudio.paused) {
                countdownAudio.currentTime = 0;
                countdownAudio.play().then(() => {
                    btn.innerHTML = "⏹️ Stop Audio Test";
                    appendLog("> 🔊 Audio test playing.");
                }).catch(err => {
                    appendLog("ERROR: ❌ Audio blocked by browser policy.");
                });
            } else {
                countdownAudio.pause();
                countdownAudio.currentTime = 0;
                btn.innerHTML = "🔊 Test Audio (Play)";
                appendLog("> 🔇 Audio test stopped by operator.");
            }
        }

        socket.on('connect', () => { socket.emit('request_sync'); });

        socket.on('terminal_history', (historyArray) => {
            terminalBox.innerHTML = ''; 
            historyArray.forEach(log => appendLog(log));
        });

        socket.on('countdown_tick', (second) => {
            if (second === 10) {
                countdownAudio.currentTime = 0; 
                countdownAudio.play().catch(err => {});
            }
        });

        setInterval(() => { liveView.src = `http://localhost:5513/liveview.jpg?t=${new Date().getTime()}`; }, 66);

        function appendLog(data) {
            const logElement = document.createElement('div');
            logElement.classList.add('log-entry');
            if (data.includes('INSUFFICIENT_FUNDS') || data.includes('ABORTED') || data.includes('ERROR')) logElement.classList.add('log-error');
            if (data.includes('BALANCE') || data.includes('Loaded historical') || data.includes('reset customer balance')) logElement.classList.add('log-money');
            
            logElement.textContent = data.startsWith('>') ? data : `> ${data}`;
            terminalBox.appendChild(logElement);
            terminalBox.scrollTop = terminalBox.scrollHeight;
        }

        socket.on('terminal_log', (data) => { appendLog(data); });

        function clearTerminal() { socket.emit('clear_terminal'); }

        function resetBalance() {
            if(confirm("Are you sure you want to reset the current customer's balance to 0 PHP?")) {
                socket.emit('reset_balance');
            }
        }

        function applyFilterToPreview(filterName) {
            let cleanName = filterName.replace('FILTER:', '').trim();
            if (cleanName === 'FILTER_1' || cleanName === 'B&W') cleanName = 'NOIR';
            if (cleanName === 'FILTER_2' || cleanName === 'VINTAGE') cleanName = 'FILM_II';

            document.getElementById('filterDisplay').innerText = cleanName;
            
            liveView.className = ''; 
            if (cleanName === 'NOIR') {
                liveView.classList.add('filter-NOIR');
            } else if (cleanName === 'FILM_II') {
                liveView.classList.add('filter-FILM-II');
            } else {
                liveView.classList.add('filter-NORMAL');
            }
        }

        socket.on('hardware_update', (data) => {
            if (data.type === 'balance') {
                document.getElementById('balanceDisplay').innerText = `${data.value} PHP`;
            } else if (data.type === 'filter') {
                applyFilterToPreview(data.value); 
            } else if (data.type === 'trigger' || data.type === 'status') {
                const statusEl = document.getElementById('sessionDisplay');
                if (data.value === 'START' || data.value === 'PROCESSING') {
                    statusEl.innerText = "CAMERA ACTIVE";
                    statusEl.style.color = "#ef4444"; 
                } else {
                    statusEl.innerText = "IDLE";
                    statusEl.style.color = "#4ade80"; 
                }
            }
        });

        socket.on('collage_ready', (imageUrl) => {
            const overlay = document.getElementById('resultOverlay');
            document.getElementById('finalCollageImg').src = imageUrl;
            overlay.style.display = 'flex';
            overlayTimeout = setTimeout(() => { closeResultOverlay(); }, 10000); 
        });

        function closeResultOverlay() {
            const overlay = document.getElementById('resultOverlay');
            if (overlay.style.display === 'flex') {
                clearTimeout(overlayTimeout); 
                overlay.style.display = 'none';
                document.getElementById('sessionDisplay').innerText = "IDLE";
                document.getElementById('sessionDisplay').style.color = "#4ade80";
                socket.emit('session_complete');
            }
        }

        function setManualFilter(filterType) {
            socket.emit('set_filter', filterType);
            applyFilterToPreview(filterType); 
        }

        document.getElementById('btnForceStart').addEventListener('click', () => {
            if (document.getElementById('sessionDisplay').innerText !== "CAMERA ACTIVE") { socket.emit('force_start'); }
        });

        document.getElementById('btnAbort').addEventListener('click', () => {
            socket.emit('abort_session');
            document.getElementById('resultOverlay').style.display = 'none'; 
        });

        function triggerSystemRestart() {
            if (confirm("⚠️ Are you sure you want to completely reboot the backend system?")) {
                socket.emit('restart_system');
                setTimeout(() => { location.reload(); }, 4000);
            }
        }
    </script>
</body>
</html>
