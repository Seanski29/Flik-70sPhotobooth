<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLIK | Master Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="http://localhost:3001/socket.io/socket.io.js"></script>
    <style>
        /* CSS OVERRIDES TO PREVENT SCROLLING */
        body.app-layout, .workspace { height: 100vh; overflow: hidden; margin: 0; }
        .dashboard-container { display: flex; height: calc(100vh - 75px); gap: 10px; overflow: hidden; }
        .terminal-container { flex: 1; height: 100%; display: flex; flex-direction: column; }
        .terminal { flex: 1; overflow-y: auto; }
        .right-column { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .preview-card { background: #1e1e1e; border-radius: 8px; margin-bottom: 5px; text-align: center; }
        .preview-card img { max-height: 20vh; width: auto; object-fit: contain; }
        .panel-box { padding: 8px 12px; margin-bottom: 5px; }
        .metric { padding: 2px 0; }
        h3 { margin: 3px 0; font-size: 13px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
        .btn-test, .btn-op { padding: 6px; font-size: 12px; font-weight: bold; border: none; border-radius: 4px; color: white; cursor: pointer; transition: 0.2s ease; }

        /* Slider */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin-top: 5px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #ef4444; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 5px; cursor: pointer; background: #555; border-radius: 3px; }
    </style>
</head>
<body class="app-layout">

    <div id="sidebar-container"></div> 

    <div id="resultOverlay">
        <button class="close-overlay-btn" onclick="closeResultOverlay()">&times;</button>
        <h2 style="color: #4ade80; margin-bottom: 20px; font-family: 'Inter', sans-serif;">Session Complete!</h2>
        <img id="finalCollageImg" src="" alt="Final Strip">
    </div>

    <main class="workspace">
        <header class="workspace-header" style="padding-bottom: 5px;">
            <div>
                <h2 class="page-title">SYSTEM DASHBOARD</h2>
                <p class="page-subtitle">Event Command Center</p>
            </div>
            <button class="btn-op btn-filter" style="padding: 8px 15px; font-size: 13px;" onclick="clearTerminal()">CLEAR LOGS</button>
        </header>

        <div class="dashboard-container">
            <div class="terminal-container">
                <div class="terminal" id="terminalBox">
                    <div class="log-entry">> Initializing System UI...</div>
                </div>
            </div>

            <div class="right-column">
                <div class="preview-card">
                    <img id="webcam-preview" class="filter-NORMAL" src="http://localhost:5513/liveview.jpg">
                </div>

                <div class="panel-box">
                    <h3>Live Status</h3>
                    <div class="grid-3">
                        <div class="metric">Balance: <span class="metric-value" id="balanceDisplay">0 PHP</span></div>
                        <div class="metric">Filter: <span class="metric-value" id="filterDisplay">NORMAL</span></div>
                        <div class="metric">Status: <span class="metric-value" id="sessionDisplay">IDLE</span></div>
                    </div>
                </div>

                <div class="panel-box operator-panel" style="flex: 1; overflow-y: auto;">
                    <h3>Manual Filter Override</h3>
                    <div class="grid-3">
                        <button class="btn-op btn-filter" onclick="setManualFilter('NORMAL')">Normal</button>
                        <button class="btn-op btn-filter" onclick="setManualFilter('NOIR')">Noir</button>
                        <button class="btn-op btn-filter" onclick="setManualFilter('FILM_II')">Film II</button>
                    </div>
                    
                    <h3 style="margin-top: 8px;">Settings</h3>
                    <div class="metric" style="flex-direction: column; align-items: flex-start; gap: 0;">
                        <label style="font-size: 13px; font-weight: bold; color: #ccc;">Photo Countdown: <span id="timerLabel" style="color:#ef4444;">10</span>s</label>
                        <input type="range" id="timerSlider" min="3" max="10" value="10">
                    </div>

                    <h3 style="margin-top: 8px;">Hardware Tests</h3>
                    <div class="grid-3">
                        <button id="btnTestSysRed" class="btn-test" style="background: #991b1b;" onclick="toggleSysRedLED()">Sys Red: ON</button>
                        <button id="btnTestArcRed" class="btn-test" style="background: #7f1d1d;" onclick="toggleArcadeRedLED()">Arcade Red: OFF</button>
                        <button id="btnTestGreen" class="btn-test" style="background: #14532d;" onclick="toggleGreenLED()">Green LED: OFF</button>
                        <button id="btnTestAudio" class="btn-test" style="background: #3b82f6; grid-column: span 1;" onclick="toggleTestAudio()">Test Count 🔊</button>
                        <button id="btnTestBGAudio" class="btn-test" style="background: #8b5cf6; grid-column: span 2;" onclick="toggleBGAudio()">Test BG Music 🎵</button>
                    </div>

                    <h3 style="margin-top: 8px;">Overrides & Controls</h3>
                    <div class="grid-3">
                        <button id="btnForceStart" class="btn-op btn-force">Force Start</button>
                        <button class="btn-op btn-reset" onclick="resetBalance()">Reset Balance</button>
                        <button id="btnAbort" class="btn-op btn-abort">Abort Session</button>
                        <button id="btnRestart" class="btn-op btn-restart" style="grid-column: span 3;" onclick="triggerSystemRestart()">Restart System</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/sidebar.js"></script>
<script>
        const socket = io('http://localhost:3001');
        const terminalBox = document.getElementById('terminalBox');
        const liveView = document.getElementById('webcam-preview');
        const timerSlider = document.getElementById('timerSlider');
        const timerLabel = document.getElementById('timerLabel');
        
        const countdownAudio = new Audio('../../assets/10_sc.mp3');
        const bgAudio = new Audio('../../assets/bg_music.mp3');
        
        // --- AUDIO VOLUME MIXER FOR ELECTRON ---
        countdownAudio.volume = 0.5; // Drops the countdown volume to 50%
        bgAudio.volume = 1.0;        // Keeps background music at 100%
        bgAudio.loop = true; 

        let overlayTimeout; 
        let audioUnlocked = false;

        document.body.addEventListener('click', () => {
            if (!audioUnlocked) {
                countdownAudio.play().then(() => {
                    countdownAudio.pause(); countdownAudio.currentTime = 0;
                    bgAudio.play().then(() => {
                        bgAudio.pause(); bgAudio.currentTime = 0;
                        audioUnlocked = true;
                    });
                }).catch(err => {});
            }
        }, { once: true });

        countdownAudio.onended = () => { document.getElementById('btnTestAudio').innerHTML = "Test Count 🔊"; };

        function toggleTestAudio() {
            const btn = document.getElementById('btnTestAudio');
            if (countdownAudio.paused) {
                countdownAudio.currentTime = 0;
                countdownAudio.play().then(() => {
                    btn.innerHTML = "⏹ Stop Count";
                    appendLog("> Audio test playing.");
                }).catch(err => appendLog("ERROR: ❌ Audio blocked."));
            } else {
                countdownAudio.pause(); countdownAudio.currentTime = 0;
                btn.innerHTML = "Test Count 🔊";
            }
        }

        socket.on('bg_music_command', (cmd) => {
            if (cmd === 'PLAY') {
                bgAudio.play().catch(e => console.log(e));
            } else if (cmd === 'STOP') {
                bgAudio.pause();
                bgAudio.currentTime = 0;
            }
        });

        function toggleBGAudio() {
            const btn = document.getElementById('btnTestBGAudio');
            if (bgAudio.paused) {
                bgAudio.play().then(() => { btn.innerHTML = "⏹ Stop BG Music"; })
                       .catch(err => appendLog("ERROR: ❌ BG Audio blocked."));
            } else {
                bgAudio.pause(); bgAudio.currentTime = 0;
                btn.innerHTML = "Test BG Music 🎵";
            }
        }

        socket.on('connect', () => { socket.emit('request_sync'); });

        socket.on('terminal_history', (historyArray) => {
            terminalBox.innerHTML = ''; 
            historyArray.forEach(log => appendLog(log));
        });

        timerSlider.addEventListener('input', (e) => { timerLabel.innerText = e.target.value; });
        timerSlider.addEventListener('change', (e) => { socket.emit('update_countdown', e.target.value); });
        socket.on('sync_timer', (val) => {
            timerSlider.value = val;
            timerLabel.innerText = val;
        });
        
        // --- UPDATED: PLAY BG MUSIC ALONGSIDE TIMER ---
        socket.on('countdown_tick', (second) => {
            let maxAudioSec = Math.min(timerSlider.value, 10); 
            if (second === maxAudioSec) {
                countdownAudio.currentTime = 10 - maxAudioSec; 
                
                // Play the countdown
                countdownAudio.play().catch(err => {});
                
                // Also force the BG music to play if it isn't already playing!
                if (bgAudio.paused) {
                    bgAudio.play().catch(err => {});
                }
            }
        });

        setInterval(() => { liveView.src = `http://localhost:5513/liveview.jpg?t=${new Date().getTime()}`; }, 66);

        function appendLog(data) {
            const logElement = document.createElement('div');
            logElement.classList.add('log-entry');
            if (data.includes('INSUFFICIENT_FUNDS') || data.includes('WARNING') || data.includes('ERROR')) logElement.classList.add('log-error');
            if (data.includes('BALANCE') || data.includes('Loaded historical') || data.includes('reset customer balance')) logElement.classList.add('log-money');
            
            logElement.textContent = data.startsWith('>') ? data : `> ${data}`;
            terminalBox.appendChild(logElement);
            terminalBox.scrollTop = terminalBox.scrollHeight;
        }

        socket.on('terminal_log', (data) => { appendLog(data); });
        function clearTerminal() { socket.emit('clear_terminal'); }
        function resetBalance() {
            if(confirm("Are you sure you want to reset the current customer's balance to 0 PHP?")) socket.emit('reset_balance');
        }

        function applyFilterToPreview(filterName) {
            let cleanName = filterName.replace('FILTER:', '').trim();
            if (cleanName === 'FILTER_1' || cleanName === 'B&W') cleanName = 'NOIR';
            if (cleanName === 'FILTER_2' || cleanName === 'VINTAGE') cleanName = 'FILM_II';

            document.getElementById('filterDisplay').innerText = cleanName;
            liveView.className = ''; 
            if (cleanName === 'NOIR') liveView.classList.add('filter-NOIR');
            else if (cleanName === 'FILM_II') liveView.classList.add('filter-FILM-II');
            else liveView.classList.add('filter-NORMAL');
        }

        socket.on('hardware_update', (data) => {
            if (data.type === 'balance') {
                document.getElementById('balanceDisplay').innerText = `${data.value} PHP`;
            } else if (data.type === 'filter') {
                applyFilterToPreview(data.value); 
            } else if (data.type === 'trigger' || data.type === 'status') {
                const statusEl = document.getElementById('sessionDisplay');
                if (data.value === 'START' || data.value === 'PROCESSING') {
                    statusEl.innerText = "CAMERA ACTIVE";
                    statusEl.style.color = "#ef4444"; 
                } else {
                    statusEl.innerText = "IDLE";
                    statusEl.style.color = "#4ade80"; 
                }
            }
        });

        socket.on('collage_ready', (imageUrl) => {
            const overlay = document.getElementById('resultOverlay');
            document.getElementById('finalCollageImg').src = imageUrl;
            overlay.style.display = 'flex';
            overlayTimeout = setTimeout(() => { closeResultOverlay(); }, 10000); 
        });

        function closeResultOverlay() {
            const overlay = document.getElementById('resultOverlay');
            if (overlay.style.display === 'flex') {
                clearTimeout(overlayTimeout); 
                overlay.style.display = 'none';
                document.getElementById('sessionDisplay').innerText = "IDLE";
                document.getElementById('sessionDisplay').style.color = "#4ade80";
                socket.emit('session_complete');
            }
        }

        function setManualFilter(filterType) {
            socket.emit('set_filter', filterType);
            applyFilterToPreview(filterType); 
        }

        let isSysRedOn = true;
        function toggleSysRedLED() {
            isSysRedOn = !isSysRedOn;
            const btn = document.getElementById('btnTestSysRed');
            if (isSysRedOn) {
                socket.emit('test_led', 'IDLE'); 
                btn.style.background = '#991b1b'; btn.innerText = 'Sys Red: ON';
                isArcRedOn = false; document.getElementById('btnTestArcRed').style.background = '#7f1d1d'; document.getElementById('btnTestArcRed').innerText = 'Arcade Red: OFF';
            } else {
                socket.emit('test_led', 'SESSION_START'); 
                btn.style.background = '#450a0a'; btn.innerText = 'Sys Red: OFF';
            }
        }

        let isArcRedOn = false;
        function toggleArcadeRedLED() {
            isArcRedOn = !isArcRedOn;
            const btn = document.getElementById('btnTestArcRed');
            if (isArcRedOn) {
                socket.emit('test_led', 'READY_TO_START'); 
                btn.style.background = '#ef4444'; btn.innerText = 'Arcade Red: ON';
                isSysRedOn = false; document.getElementById('btnTestSysRed').style.background = '#450a0a'; document.getElementById('btnTestSysRed').innerText = 'Sys Red: OFF';
            } else {
                socket.emit('test_led', 'SESSION_START'); 
                btn.style.background = '#7f1d1d'; btn.innerText = 'Arcade Red: OFF';
            }
        }

        let isGreenTestOn = false;
        function toggleGreenLED() {
            isGreenTestOn = !isGreenTestOn;
            const btn = document.getElementById('btnTestGreen');
            if (isGreenTestOn) {
                socket.emit('test_led', 'GREEN_ON');
                btn.style.background = '#22c55e'; btn.innerText = 'Green LED: ON';
            } else {
                socket.emit('test_led', 'GREEN_OFF');
                btn.style.background = '#14532d'; btn.innerText = 'Green LED: OFF';
            }
        }

        document.getElementById('btnForceStart').addEventListener('click', () => {
            if (document.getElementById('sessionDisplay').innerText !== "CAMERA ACTIVE") { socket.emit('force_start'); }
        });

        document.getElementById('btnAbort').addEventListener('click', () => {
            socket.emit('abort_session');
            document.getElementById('resultOverlay').style.display = 'none'; 
            isSysRedOn = true;
            document.getElementById('btnTestSysRed').style.background = '#991b1b'; document.getElementById('btnTestSysRed').innerText = 'Sys Red: ON';
            isArcRedOn = false;
            document.getElementById('btnTestArcRed').style.background = '#7f1d1d'; document.getElementById('btnTestArcRed').innerText = 'Arcade Red: OFF';
            isGreenTestOn = false;
            document.getElementById('btnTestGreen').style.background = '#14532d'; document.getElementById('btnTestGreen').innerText = 'Green LED: OFF';
        });

        function triggerSystemRestart() {
            if (confirm("⚠️ Are you sure you want to completely reboot the system?")) {
                socket.emit('restart_system');
                setTimeout(() => { location.reload(); }, 4000);
            }
        }
    </script>
</body>
</html>
