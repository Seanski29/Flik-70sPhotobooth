<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLIK | Master Dashboard</title>
    
    <link rel="stylesheet" href="../css/style.css">
    <script src="http://localhost:3001/socket.io/socket.io.js"></script>
    
    <style>
        .dashboard-container { display: flex; gap: 20px; margin-top: 20px; align-items: flex-start; }
        
        .terminal-container { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .terminal-header { 
            display: flex; justify-content: space-between; align-items: center; 
            color: #888; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
            background: var(--panel-bg, #1e1e1e); padding: 10px 15px; border-radius: 8px;
        }
        .btn-clear { 
            background: #374151; color: #fff; border: none; padding: 6px 12px; 
            border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .btn-clear:hover { background: #4b5563; }

        /* BUG FIX: Strict height rules to enforce internal scrolling */
        .terminal {
            background: #000; border: 1px solid #333; border-radius: 8px;
            height: 650px; min-height: 650px; max-height: 650px; 
            padding: 15px; overflow-y: auto; display: block;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            font-family: 'Courier New', Courier, monospace; color: #fff;
        }
        
        .log-entry { margin: 6px 0; color: #0f0; font-size: 18px; font-weight: bold; }
        .log-error { color: #f00; }
        .log-money { color: #ff0; }
        
        .right-column { width: 450px; display: flex; flex-direction: column; gap: 15px; flex-shrink: 0; }

        .preview-card { background: var(--panel-bg, #1e1e1e); padding: 10px; border-radius: 8px; }
        #webcam-preview {
            width: 100%; height: 300px; object-fit: cover; border-radius: 6px;
            background-color: #111; transform: scaleX(-1); transition: filter 0.3s ease;
        }
        
        .filter-NORMAL { filter: none; }
        .filter-NOIR { filter: grayscale(100%) contrast(140%) brightness(95%); }
        .filter-FILM-II { filter: sepia(20%) contrast(110%) saturate(130%) hue-rotate(-5deg); }    

        .panel-box { padding: 15px 20px; background: var(--panel-bg, #1e1e1e); border-radius: 8px; color: #fff; }
        .panel-box h3 { color: #888; font-size: 13px; margin-top: 0; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        .metric { font-size: 16px; margin-bottom: 10px; font-weight: 500; display: flex; justify-content: space-between; align-items: center;}
        .metric:last-child { margin-bottom: 0; }
        .metric-value { font-weight: 700; }
        #sessionDisplay { color: #4ade80; }

        .operator-panel { display: flex; flex-direction: column; gap: 10px; }
        .filter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        
        .btn-op {
            padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; color: #fff;
        }
        .btn-filter { background-color: #4b5563; font-size: 13px; }
        .btn-filter:hover { background-color: #6b7280; }
        .btn-filter:active { transform: scale(0.95); }
        .btn-force { background-color: #3b82f6; }
        .btn-force:hover { background-color: #2563eb; }
        .btn-force:active { transform: scale(0.98); }
        .btn-abort { background-color: #ef4444; }
        .btn-abort:hover { background-color: #dc2626; }
        .btn-abort:active { transform: scale(0.98); }
        
        .btn-audio { background-color: #8b5cf6; }
        .btn-audio:hover { background-color: #7c3aed; }
        .btn-audio:active { transform: scale(0.98); }

        #resultOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999; 
            justify-content: center; align-items: center; flex-direction: column;
        }
        #finalCollageImg { max-height: 85%; border-radius: 8px; box-shadow: 0 0 40px rgba(255,255,255,0.1); }
        
        .close-overlay-btn {
            position: absolute; top: 20px; right: 30px;
            color: #fff; font-size: 40px; cursor: pointer;
            font-weight: bold; background: transparent; border: none;
        }
        .close-overlay-btn:hover { color: #ef4444; }
    </style>
</head>
<body class="app-layout">

    <div id="sidebar-container"></div> 

    <div id="resultOverlay">
        <button class="close-overlay-btn" onclick="closeResultOverlay()">&times;</button>
        <h2 style="color: #4ade80; margin-bottom: 20px; font-family: 'Inter', sans-serif;">🎉 Session Complete!</h2>
        <img id="finalCollageImg" src="" alt="Final Strip">
    </div>

    <main class="workspace">
        <header class="workspace-header">
            <div>
                <h2 class="page-title">⚡ FLIK SYSTEM DASHBOARD</h2>
                <p class="page-subtitle">Event Command Center</p>
            </div>
        </header>

        <div class="dashboard-container">
            <div class="terminal-container">
                <div class="terminal-header">
                    <span>System Logs</span>
                    <button class="btn-clear" onclick="clearTerminal()">🔄 CLEAR TERMINAL</button>
                </div>
                <div class="terminal" id="terminalBox">
                    <div class="log-entry">> Initializing UI...</div>
                </div>
            </div>

            <div class="right-column">
                <div class="preview-card">
                    <img id="webcam-preview" class="filter-COLOR" src="http://localhost:5513/liveview.jpg">
                </div>

                <div class="panel-box">
                    <h3>Live Status</h3>
                    <div class="metric"><span>Customer Balance:</span> <span class="metric-value" id="balanceDisplay">0 PHP</span></div>
                    <div class="metric"><span>Active Filter:</span> <span class="metric-value" id="filterDisplay">NORMAL</span></div>
                    <div class="metric"><span>System Status:</span> <span class="metric-value" id="sessionDisplay">IDLE</span></div>
                </div>

                <div class="panel-box operator-panel">
                    <h3>Manual Filter Override</h3>
                    <div class="filter-grid">
                        <button class="btn-op btn-filter" onclick="setManualFilter('NORMAL')">🎨 Normal</button>
                        <button class="btn-op btn-filter" onclick="setManualFilter('NOIR')">⚫ Noir</button>
                        <button class="btn-op btn-filter" onclick="setManualFilter('FILM_II')">🎞️ Film II</button>
                    </div>

                    <h3 style="margin-top: 10px;">Session Overrides</h3>
                    <button id="btnForceStart" class="btn-op btn-force">📸 Force Start (Free Play)</button>
                    <button id="btnAbort" class="btn-op btn-abort">🛑 Abort Session</button>
                    
                    <h3 style="margin-top: 10px;">Audio Diagnostics</h3>
                    <button id="btnTestAudio" class="btn-op btn-audio" onclick="toggleTestAudio()">🔊 Test Audio (Play)</button>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/sidebar.js"></script>
    <script>
        const socket = io('http://localhost:3001');
        const terminalBox = document.getElementById('terminalBox');
        const liveView = document.getElementById('webcam-preview');
        
        const countdownAudio = new Audio('../../assets/10_sec_countdown.mp3');
        let overlayTimeout; 
        let audioUnlocked = false;

        document.body.addEventListener('click', () => {
            if (!audioUnlocked) {
                countdownAudio.play().then(() => {
                    countdownAudio.pause();
                    countdownAudio.currentTime = 0;
                    audioUnlocked = true;
                    console.log("Audio engine globally unlocked.");
                }).catch(err => {
                    console.warn("Silent unlock failed, waiting for next click...");
                });
            }
        }, { once: true });

        countdownAudio.onended = () => {
            document.getElementById('btnTestAudio').innerHTML = "🔊 Test Audio (Play)";
        };

        function toggleTestAudio() {
            const btn = document.getElementById('btnTestAudio');
            
            if (countdownAudio.paused) {
                countdownAudio.currentTime = 0;
                countdownAudio.play().then(() => {
                    btn.innerHTML = "⏹️ Stop Audio Test";
                    appendLog("> 🔊 Audio test playing.");
                }).catch(err => {
                    console.warn("Audio blocked:", err);
                    appendLog("ERROR: ❌ Audio blocked by browser policy.");
                });
            } else {
                countdownAudio.pause();
                countdownAudio.currentTime = 0;
                btn.innerHTML = "🔊 Test Audio (Play)";
                appendLog("> 🔇 Audio test stopped by operator.");
            }
        }

        socket.on('connect', () => {
            socket.emit('request_sync');
        });

        socket.on('terminal_history', (historyArray) => {
            terminalBox.innerHTML = ''; 
            historyArray.forEach(log => appendLog(log));
        });

        socket.on('countdown_tick', (second) => {
            if (second === 10) {
                countdownAudio.currentTime = 0; 
                countdownAudio.play().catch(err => {
                    console.warn("⚠️ Audio blocked!");
                });
            }
        });

        setInterval(() => { liveView.src = `http://localhost:5513/liveview.jpg?t=${new Date().getTime()}`; }, 66);

        function appendLog(data) {
            const logElement = document.createElement('div');
            logElement.classList.add('log-entry');
            if (data.includes('INSUFFICIENT_FUNDS') || data.includes('ABORTED') || data.includes('ERROR')) logElement.classList.add('log-error');
            if (data.includes('BALANCE')) logElement.classList.add('log-money');
            
            logElement.textContent = data.startsWith('>') ? data : `> ${data}`;
            terminalBox.appendChild(logElement);
            terminalBox.scrollTop = terminalBox.scrollHeight;
        }

        socket.on('terminal_log', (data) => {
            appendLog(data);
        });

        function clearTerminal() {
            socket.emit('clear_terminal');
        }

        function applyFilterToPreview(filterName) {
            const cleanName = filterName.replace('FILTER:', '').trim();
            document.getElementById('filterDisplay').innerText = cleanName;
            
            liveView.className = ''; 
            if (cleanName === 'NORMAL') liveView.classList.add('filter-NORMAL');
            else if (cleanName === 'NOIR') liveView.classList.add('filter-NOIR');
            else if (cleanName === 'FILM_II') liveView.classList.add('filter-FILM-II');
        }

        socket.on('hardware_update', (data) => {
            if (data.type === 'balance') {
                document.getElementById('balanceDisplay').innerText = `${data.value} PHP`;
            } else if (data.type === 'filter') {
                applyFilterToPreview(data.value); 
            } else if (data.type === 'trigger' || data.type === 'status') {
                const statusEl = document.getElementById('sessionDisplay');
                if (data.value === 'START' || data.value === 'PROCESSING') {
                    statusEl.innerText = "CAMERA ACTIVE";
                    statusEl.style.color = "#ef4444"; 
                } else {
                    statusEl.innerText = "IDLE";
                    statusEl.style.color = "#4ade80"; 
                }
            }
        });

        socket.on('collage_ready', (imageUrl) => {
            const overlay = document.getElementById('resultOverlay');
            document.getElementById('finalCollageImg').src = imageUrl;
            overlay.style.display = 'flex';
            
            overlayTimeout = setTimeout(() => {
                closeResultOverlay();
            }, 10000); 
        });

        function closeResultOverlay() {
            const overlay = document.getElementById('resultOverlay');
            if (overlay.style.display === 'flex') {
                clearTimeout(overlayTimeout); 
                overlay.style.display = 'none';
                document.getElementById('sessionDisplay').innerText = "IDLE";
                document.getElementById('sessionDisplay').style.color = "#4ade80";
                socket.emit('session_complete');
            }
        }

        function setManualFilter(filterType) {
            socket.emit('set_filter', filterType);
            applyFilterToPreview(filterType); 
        }

        document.getElementById('btnForceStart').addEventListener('click', () => {
            if (document.getElementById('sessionDisplay').innerText !== "CAMERA ACTIVE") { socket.emit('force_start'); }
        });

        document.getElementById('btnAbort').addEventListener('click', () => {
            socket.emit('abort_session');
            document.getElementById('resultOverlay').style.display = 'none'; 
        });
    </script>
</body>
</html>
